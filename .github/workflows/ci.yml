# Continuous Integration workflow
# Runs tests, linting, type checking and CDK synthesis on pull requests.
# No push trigger: a pull_request run already tests the PR merged into its
# base, so re-running after the merge only spends Actions minutes
# (psd-dev-standards standards/06 §4, CIO decision 2026-11-18).
name: CI

on:
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint, and Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Node stays installed: next, jest and tsc run on Node via their shebangs.
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 20.x

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.5

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run linter
      run: bun run lint

    - name: Run type checking
      run: bun run typecheck

    - name: Run tests
      run: bun run test
      env:
        # Prevent tests from timing out in CI
        CI: true

  # CDK validation job - checks infrastructure code
  cdk-validate:
    name: Validate CDK Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Node and npm stay: the DbInitLambda asset (infra/database/lambda) is
    # bundled with npm, locally or in the Lambda Node.js bundling image.
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 20.x

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.5

    - name: Install dependencies
      run: |
        bun install --frozen-lockfile
        cd infra && bun install --frozen-lockfile

    - name: Build CDK TypeScript
      run: cd infra && bun run build

    - name: Synthesize CDK stacks
      run: |
        cd infra
        bun run cdk synth --context baseDomain=example.com --context ci=true
      env:
        # Dummy values for synthesis only - not for deployment
        CDK_DEFAULT_ACCOUNT: '123456789012'
        CDK_DEFAULT_REGION: 'us-east-1'

    # Show infrastructure changes on PRs
    - name: CDK Diff
      run: |
        cd infra
        echo "## Infrastructure Changes" >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY
        bun run cdk diff --context baseDomain=example.com --context ci=true 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
        echo "```" >> $GITHUB_STEP_SUMMARY
      env:
        CDK_DEFAULT_ACCOUNT: '123456789012'
        CDK_DEFAULT_REGION: 'us-east-1'
