name: PSD CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  psd-ci:
    # @main is deliberate: org-owned reusable; central bumps must propagate
    # (psd-dev-standards standards/06). zizmor: ignore[unpinned-uses]
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      # ci.yml gates on lint, typecheck and jest (all `auto` here) but never
      # runs `next build`; skip it until it is proven on a secret-less runner.
      build-command: ""
